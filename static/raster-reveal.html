<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pencil brush reveal</title><style>*{box-sizing:border-box}body{margin:0;background:#efeee8;color:#45433f;font:15px system-ui;line-height:1.5;padding:28px}h1{font-size:26px;margin:0 0 8px}h2{font-size:17px;margin-top:28px}.controls{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:20px 0}button{font:inherit;padding:8px 16px;background:transparent;border:1px solid #45433f66;border-radius:6px;cursor:pointer}input[type=range]{width:220px}.stages{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:16px}figure{margin:0;display:grid;justify-items:center}.drawing{width:160px;height:180px;display:grid;align-items:center;mix-blend-mode:multiply}figcaption{font-size:13px}pre{font-size:11px}p{max-width:90ch}@media(max-width:740px){body{padding:16px}.stages{grid-template-columns:repeat(2,minmax(140px,1fr))}}</style><h1>Pencil brush reveal</h1><p>Nano Banana Lite on white, blended with multiply. A slower 4.8-second reveal: small back-and-forth scribbles revisit each patch, then lift and move on. Every gesture starts quickly and eases to a slower finish. Half-opacity passes build the pencil locally.</p><div class="controls"><button id="replay">Replay drawing</button><label>Scrub <input id="progress" type="range" min="0" max="1" step="0.01" value="0"></label><label><input id="reduced" type="checkbox"> Reduce motion</label></div><main></main><details><summary>Mask diagnostics</summary><pre id="diagnostics"></pre></details><script type="module" src="/static/raster-reveal-preview.js"></script></html>
