</style><link rel="stylesheet" href="/static/paper-theme.css?v=cara-calm-2"></head><body><div id="paper-background" aria-hidden="true"></div><header><div class="brand"><svg width="27" height="30" viewBox="0 0 27 30" fill="none" aria-hidden="true"><path d="M5 5h9a7 7 0 0 1 0 14H9a5 5 0 0 1 0-10h9a7 7 0 0 1 0 14H9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>thread<span class="tagline">A little space to think out loud.</span></div><div class="header-actions"><button id="conversation-toggle" class="quiet" aria-controls="conversation-panel" aria-expanded="false" aria-label="Show conversation">Conversation</button><button id="reset" class="quiet">Clear map</button></div></header><main class="layout"><section class="workspace" aria-label="Live idea map"><div id="graph"></div><div class="graph-top"><div class="graph-label"><i id="pulse" class="pulse"></i><span id="graph-status" role="status">Connecting your canvas…</span></div><div class="canvas-actions"><button id="reorder" class="quiet" aria-label="Rearrange map" title="Cycle horizontal, vertical and reverse layouts">Rearrange</button><button id="fit" class="quiet" aria-label="Fit map to screen">Fit map</button></div></div><div id="graph-help" class="graph-help" aria-live="polite"></div><div class="empty" id="empty"><div class="seed" aria-hidden="true">+</div><h1>Give your thoughts<br>a place to land.</h1><p>Talk through an idea. Watch it become a map, one connection at a time.</p><button id="example" class="quiet">Try an example</button></div><div class="legend"><span><i></i>Taking shape</span><span><i></i>Thought captured</span></div><div class="dock"><button id="mic" class="mic" aria-label="Start listening" disabled><svg width="21" height="24" viewBox="0 0 24 26" fill="none" aria-hidden="true"><rect x="8" y="2" width="8" height="14" rx="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 11v2a8 8 0 0 0 16 0v-2M12 21v4m-4 0h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="roun
